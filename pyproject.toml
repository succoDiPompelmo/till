[project]
name = "till"
version = "0.1.0"
description = "Personal expense tracker: Telegram bot + iPhone Shortcuts on Cloudflare Workers (Python) and D1"
readme = "README.md"
authors = [
    { name = "succoDiPompelmo", email = "zenari12@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "tzdata>=2026.5",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "workers-py>=1.17.8",
    "workers-runtime-sdk>=1.9.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
